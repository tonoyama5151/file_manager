name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PbuildNumber=${{ github.run_number }} --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk FileManager.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FileManager-${{ github.run_number }}
          path: FileManager.apk

      # 常に同じURLからダウンロードできるよう、"latest" リリースを作り直す
      # https://github.com/<owner>/<repo>/releases/latest/download/FileManager.apk
      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest FileManager.apk \
            --target "${{ github.sha }}" \
            --title "最新ビルド v1.0.${{ github.run_number }}" \
            --notes "コミット: ${{ github.sha }}" \
            --latest
